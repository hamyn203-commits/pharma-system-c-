name: al_neda_admin_flutter
description: Premium Flutter Desktop admin dashboard for Al-Neda Pharmacy Warehouse Management System.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking and API client infrastructure
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Routing and dependency injection
  go_router: ^17.0.0
  get_it: ^9.0.5

  # Persistence and environment configuration
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.0

  # Enterprise UI, charts, typography, and desktop polish
  fl_chart: ^1.1.1
  google_fonts: ^8.0.0
  intl: ^0.20.2
  window_manager: ^0.5.1

  # Model serialization support for clean data boundaries
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Diagnostics
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Keep font files under assets/fonts/ when the production build must be
  # fully offline. The theme currently uses google_fonts for rapid iteration.
  # assets:
  #   - assets/images/
  #   - assets/icons/
